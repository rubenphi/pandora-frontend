<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pandora</title>

    <base href="/" />
    <script>
      (function () {
        var originalConsole = window.console || {};
        var originalLog = originalConsole.log ? originalConsole.log.bind(originalConsole) : function () {};
        var originalInfo = originalConsole.info ? originalConsole.info.bind(originalConsole) : originalLog;
        var originalWarn = originalConsole.warn ? originalConsole.warn.bind(originalConsole) : originalLog;
        var originalError = originalConsole.error ? originalConsole.error.bind(originalConsole) : originalLog;

        var toastContainer = null;
        var lastMessage = "";
        var lastMessageTime = 0;
        var MAX_TOASTS = 2;
        var TOAST_DURATION_MS = 2200;

        function getOrCreateContainer() {
          if (!toastContainer || !document.body.contains(toastContainer)) {
            toastContainer = document.getElementById("qz-console-toast-container");
            if (!toastContainer && document.body) {
              toastContainer = document.createElement("div");
              toastContainer.id = "qz-console-toast-container";
              toastContainer.style.cssText =
                "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:999999;" +
                "display:flex;flex-direction:column;align-items:center;gap:6px;" +
                "pointer-events:none;width:92%;max-width:440px;";
              document.body.appendChild(toastContainer);
            }
          }
          return toastContainer;
        }

        function formatLogArg(arg) {
          if (arg === null) return "null";
          if (arg === undefined) return "undefined";
          if (typeof arg === "string") return arg;
          if (arg instanceof Error) return arg.message || String(arg);
          try {
            return JSON.stringify(arg);
          } catch (e) {
            return String(arg);
          }
        }

        function createConsoleToast(type, args) {
          try {
            var msg = "";
            for (var i = 0; i < args.length; i++) {
              msg += (i > 0 ? " " : "") + formatLogArg(args[i]);
            }
            msg = msg.trim();
            if (!msg) return;

            // Evitar duplicados consecutivos inmediatos
            var now = Date.now();
            if (msg === lastMessage && now - lastMessageTime < 800) {
              return;
            }
            lastMessage = msg;
            lastMessageTime = now;

            // Limitar longitud para evitar saturacion visual
            if (msg.length > 150) {
              msg = msg.substring(0, 147) + "...";
            }

            var container = getOrCreateContainer();
            if (!container) return;

            // Mantener maximo MAX_TOASTS en pantalla
            while (container.childNodes.length >= MAX_TOASTS) {
              container.removeChild(container.firstChild);
            }

            var toast = document.createElement("div");
            var dotColor = "#8c7ef8";
            if (type === "error") dotColor = "#ff4d4f";
            if (type === "warn") dotColor = "#faad14";

            toast.style.cssText =
              "background:rgba(20,16,42,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);" +
              "border:1px solid rgba(255,255,255,0.12);border-radius:10px;" +
              "box-shadow:0 6px 18px rgba(0,0,0,0.32);padding:7px 12px;" +
              "display:flex;align-items:center;gap:8px;max-width:100%;" +
              "box-sizing:border-box;pointer-events:none;opacity:0;transform:translateY(8px);" +
              "transition:opacity 0.22s ease, transform 0.22s ease;";

            var dot = document.createElement("span");
            dot.style.cssText =
              "width:7px;height:7px;border-radius:50%;background:" + dotColor + ";flex-shrink:0;";

            var text = document.createElement("span");
            text.style.cssText =
              "color:#f7f7fd;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;" +
              "font-size:11.5px;font-weight:500;line-height:1.35;word-break:break-word;overflow:hidden;";
            text.textContent = msg;

            toast.appendChild(dot);
            toast.appendChild(text);
            container.appendChild(toast);

            requestAnimationFrame(function () {
              toast.style.opacity = "1";
              toast.style.transform = "translateY(0)";
            });

            setTimeout(function () {
              toast.style.opacity = "0";
              toast.style.transform = "translateY(6px)";
              setTimeout(function () {
                if (toast.parentNode) {
                  toast.parentNode.removeChild(toast);
                }
              }, 250);
            }, TOAST_DURATION_MS);
          } catch (e) {
            // Silencioso
          }
        }

        window.console = {
          log: function () {
            originalLog.apply(originalConsole, arguments);
            createConsoleToast("log", arguments);
          },
          info: function () {
            originalInfo.apply(originalConsole, arguments);
            createConsoleToast("info", arguments);
          },
          warn: function () {
            originalWarn.apply(originalConsole, arguments);
            createConsoleToast("warn", arguments);
          },
          error: function () {
            originalError.apply(originalConsole, arguments);
            createConsoleToast("error", arguments);
          },
        };

        window.onerror = function (message) {
          originalError.call(originalConsole, "Error:", message);
          createConsoleToast("error", ["Error: " + message]);
          return false;
        };
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link
      rel="shortcut icon"
      type="image/png"
      href="<%= BASE_URL %>assets/icon/favicon.png"
    />

    <!-- Google Fonts: Rubik (Queezy Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- add to homescreen for mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
